# Temporary HTTP-only (port 80) until TLS certs exist.
# Replace with baazgo-frontend.conf after: certbot certonly --nginx -d baazgo.ziyrak.org

server {
    listen 80;
    listen [::]:80;
    server_name baazgo.ziyrak.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/baazgo/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/baazgo-frontend.access.log;
    error_log  /var/log/nginx/baazgo-frontend.error.log;
}
