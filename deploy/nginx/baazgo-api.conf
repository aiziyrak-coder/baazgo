# BaazGo API reverse proxy — new site only.
# Upstream: Node listens on 127.0.0.1:3010 (see .env.api)
#
#   sudo cp deploy/nginx/baazgo-api.conf /etc/nginx/sites-available/baazgo-api
#   sudo ln -sf /etc/nginx/sites-available/baazgo-api /etc/nginx/sites-enabled/01-baazgo-api.conf

upstream baazgo_api_upstream {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name baazgoapi.ziyrak.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baazgoapi.ziyrak.org;

    # One cert with both names: certbot -d baazgo.ziyrak.org -d baazgoapi.ziyrak.org
    ssl_certificate     /etc/letsencrypt/live/baazgo.ziyrak.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baazgo.ziyrak.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://baazgo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/baazgo-api.access.log;
    error_log  /var/log/nginx/baazgo-api.error.log;
}
