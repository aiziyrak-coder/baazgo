# Temporary HTTP-only API proxy until TLS certs exist.

upstream baazgo_api_upstream {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name baazgoapi.ziyrak.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://baazgo_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/baazgo-api.access.log;
    error_log  /var/log/nginx/baazgo-api.error.log;
}
