# BaazGo static SPA — install ONLY as a new site (does not replace default nginx).
#   sudo cp deploy/nginx/baazgo-frontend.conf /etc/nginx/sites-available/baazgo-frontend
#   sudo ln -sf /etc/nginx/sites-available/baazgo-frontend /etc/nginx/sites-enabled/01-baazgo-frontend.conf
#
# SSL: issue certs first, then adjust paths below if your layout differs:
#   sudo certbot certonly --nginx -d baazgo.ziyrak.org
#
# Front-end files: npm run build → /opt/baazgo/app/dist

server {
    listen 80;
    listen [::]:80;
    server_name baazgo.ziyrak.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baazgo.ziyrak.org;

    ssl_certificate     /etc/letsencrypt/live/baazgo.ziyrak.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baazgo.ziyrak.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/baazgo/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/baazgo-frontend.access.log;
    error_log  /var/log/nginx/baazgo-frontend.error.log;
}
